name: Mutation operator proposal
description: Propose a structured semantic fault model and deterministic discovery rule.
title: "[mutation-operator] "
labels: ["mutation-model"]
body:
  - type: input
    id: operator
    attributes:
      label: Operator and family identifiers
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Semantic fault rationale
      description: Explain the plausible validation fault, not merely the syntax change.
    validations:
      required: true
  - type: textarea
    id: discovery
    attributes:
      label: Structured discovery and deterministic identity
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusion and duplicate rules
      description: Identify configuration guards, invariants, unsupported sites, and non-semantic candidates.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Isolated build and execution validation
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Target versions, subsystems, assumptions, and limits
    validations:
      required: true
