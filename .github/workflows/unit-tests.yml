name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Publication-study tests validate artifacts against immutable predecessor commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Select validation lane
        id: lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python scripts/exploration-record check --base "$BASE"
            python scripts/exploration-record lane --base "$BASE" >> "$GITHUB_OUTPUT"
          else
            python scripts/exploration-record check
            echo "lane=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Check portable evidence replay
        if: steps.lane.outputs.lane != 'exploration'
        run: python scripts/check-portable-evidence-replay --require-foreign-checkout
      - if: steps.lane.outputs.lane != 'exploration'
        run: python scripts/run-unit-tests
