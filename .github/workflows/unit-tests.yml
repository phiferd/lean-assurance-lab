name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Publication-study tests validate artifacts against immutable predecessor commits.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Materialize pinned queue source evidence
        run: |
          mkdir -p external/lean-kernel-arena/tests
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/leanprover/lean-kernel-arena/f0fe3b379dbce91537417b529140d0ca250f271c/tests/nested-unused-param.lean \
            --output external/lean-kernel-arena/tests/nested-unused-param.lean
          echo "0d155c36d761b81a73f61d9ff260d2312626ff7a6396f310fb97a94d09bd53d7  external/lean-kernel-arena/tests/nested-unused-param.lean" \
            | sha256sum --check --strict
      - name: Select validation lane
        id: lane
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python scripts/exploration-record check --base "$BASE"
            python scripts/exploration-record lane --base "$BASE" >> "$GITHUB_OUTPUT"
          else
            python scripts/exploration-record check
            echo "lane=full" >> "$GITHUB_OUTPUT"
          fi
      - name: Check portable evidence replay
        if: steps.lane.outputs.lane != 'exploration' && steps.lane.outputs.lane != 'exploration-handoff'
        run: python scripts/check-portable-evidence-replay --require-foreign-checkout
      - name: Check E0 campaign handoff
        if: steps.lane.outputs.lane == 'exploration-handoff'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/exploration-handoff --base "$BASE" --check
      - if: steps.lane.outputs.lane != 'exploration' && steps.lane.outputs.lane != 'exploration-handoff'
        run: python scripts/run-unit-tests
